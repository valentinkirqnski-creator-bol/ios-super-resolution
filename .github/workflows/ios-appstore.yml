name: iOS App Store upload

# Builds a SIGNED .ipa on a GitHub-hosted macOS runner and uploads it to
# App Store Connect (TestFlight / App Store). No Mac of your own is needed.
#
# Signing uses AUTOMATIC signing driven by an App Store Connect API key:
# xcodebuild creates/downloads the distribution certificate and provisioning
# profile itself (-allowProvisioningUpdates), so you never generate a .p12.
#
# Manual trigger only, so it never uploads on an ordinary push.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP (all from Windows in a browser, requires the PAID account):
#   1. Enroll in the Apple Developer Program ($99/yr).
#   2. App Store Connect -> Users and Access -> Integrations -> App Store
#      Connect API -> generate a key with the "App Manager" role. Note the
#      Key ID and Issuer ID; download the AuthKey_XXXX.p8 (you can only
#      download it once).
#   3. App Store Connect -> create the app record with bundle id
#      com.handheldsr.camera, and create the in-app purchase
#      com.handheldsr.camera.unlimited.
#   4. Add these GitHub repo Secrets (Settings -> Secrets and variables ->
#      Actions -> New repository secret):
#        APPLE_TEAM_ID       your 10-char Team ID (Apple Developer -> Membership)
#        ASC_KEY_ID          the API Key ID from step 2
#        ASC_ISSUER_ID       the Issuer ID from step 2
#        ASC_KEY_P8_BASE64   the .p8 file, base64-encoded (see note below)
#
#   To base64 the .p8 on Windows PowerShell:
#     [Convert]::ToBase64String([IO.File]::ReadAllBytes("AuthKey_XXXX.p8")) > key.txt
#   then paste the contents of key.txt as the ASC_KEY_P8_BASE64 secret.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Select Xcode 26 and verify the iOS SDK
      # ---------------------------------------------------------
      - name: Select Xcode 26
        run: |
          set -e
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "ERROR: Xcode 26 was not found on this runner."
            exit 1
          fi
          echo "Selecting: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/ {print $2}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "ERROR: Xcode 26 or newer is required."
            exit 1
          fi

      # ---------------------------------------------------------
      # Install XcodeGen
      # ---------------------------------------------------------
      - name: Install XcodeGen (prebuilt binary, no Homebrew)
        run: |
          set -e
          curl -fsSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip
          chmod +x xcodegen/bin/xcodegen
          echo "XCODEGEN=$PWD/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"
          "$PWD/xcodegen/bin/xcodegen" --version

      # ---------------------------------------------------------
      # Vendor LibRaw
      # ---------------------------------------------------------
      - name: Vendor LibRaw
        run: bash scripts/fetch_libraw.sh

      # ---------------------------------------------------------
      # Build neural flow Core ML model
      # ---------------------------------------------------------
      - name: Build neural flow Core ML model
        run: bash scripts/build_neural_flow_model.sh

      # ---------------------------------------------------------
      # Generate Xcode project
      # ---------------------------------------------------------
      - name: Generate Xcode project
        run: "$XCODEGEN" generate --spec project.yml

      # ---------------------------------------------------------
      # Write the App Store Connect API key where xcodebuild/altool find it
      # ---------------------------------------------------------
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Archive (automatic signing via the API key)
      # ---------------------------------------------------------
      - name: Archive (signed)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FuzeFrame.xcodeproj \
            -scheme FuzeFrame \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FuzeFrame.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      # ---------------------------------------------------------
      # Export a signed App Store .ipa
      # ---------------------------------------------------------
      - name: Export .ipa
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FuzeFrame.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Exported:"
          ls -lh "$RUNNER_TEMP/export/"

      # ---------------------------------------------------------
      # Upload to App Store Connect (TestFlight / App Store)
      # ---------------------------------------------------------
      - name: Upload to App Store Connect
        run: |
          set -e
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # ---------------------------------------------------------
      # Also keep the signed .ipa as an artifact (handy for records)
      # ---------------------------------------------------------
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FuzeFrame-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
